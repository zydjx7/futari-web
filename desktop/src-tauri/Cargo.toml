[package]
name = "futari-desktop"
version = "0.2.4"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
semver = "1"
zip = {version="2",default-features=false,features=["deflate"]}
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { optional=true, version = "0.12", default-features = false, features = ["native-tls","json"] }
tempfile = "3"
uuid = { version = "1", features = ["v4","serde"] }
tokio = { version = "1", features = ["sync","time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows = {version="0.62",features=["Win32_UI_Accessibility","Win32_System_Com","Win32_System_Ole","Win32_System_Variant"]}
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Security","Win32_Security_Credentials","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_System_LibraryLoader","Win32_System_SystemInformation","Win32_System_RemoteDesktop","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_UI_Accessibility","Win32_UI_HiDpi","Win32_UI_Shell","Win32_Storage_FileSystem","Win32_System_WindowsProgramming","Win32_System_Threading"]}

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
cloud-sync = ["dep:reqwest"]

[profile.release]
strip = true
opt-level = "s"
